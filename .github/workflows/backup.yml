name: Respaldo de la base

# El plan Free de Supabase NO hace respaldos automaticos: la documentacion
# dice que los respaldos diarios son solo para Pro, Team y Enterprise, y que
# los proyectos Free deberian exportar sus datos por su cuenta. Si alguien
# borra un aviso por error, sin esto no hay de donde recuperarlo.
#
# Que guarda: el CONTENIDO del colegio (avisos, eventos, galeria, documentos
# con sus datos, e informacion institucional).
#
# Que NO guarda, y hay que decirlo claro:
#   - Los archivos binarios. Un PDF o una foto borrados de Storage no se
#     recuperan con esto: el respaldo guarda la ruta del archivo, no el
#     archivo. Por eso el colegio debe conservar los originales.
#   - Las cuentas de administracion. Esas viven en Supabase Auth y no en una
#     tabla del esquema public.
#   - El codigo. Eso esta en el historial de git.
#
#Como se restaura: ver la seccion "Si algo se rompe" del README.md.
on:
  schedule:
    # 04:52 UTC. Distinto del keep-alive (04:17) a proposito, para no caer en
    # el mismo minuto saturado de la cola de cron de GitHub.
    - cron: '52 4 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: respaldo-base
  # Si una corrida se queda colgada, cancelarla es correcto: el respaldo del
  # dia siguiente la reemplaza.
  cancel-in-progress: true

jobs:
  respaldo:
    name: Snapshot JSON de las tablas de contenido
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rkbwrnapphehxvbatvia

    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 1. Traer el contenido y armar un archivo .sql
      #
      # Se usa jsonb_populate_recordset en lugar de un pg_dump porque no
      # depende del CLI de Supabase, y el archivo resultante se restaura
      # con Postgres puro:
      #
      #   insert into public.announcements
      #   select * from jsonb_populate_recordset(null::public.announcements, '<json>'::jsonb);
      #
      # El delimitador dollar-quoted es $iejson$ y no $json$ a proposito: el
      # delimitador tiene que ser una cadena que no pueda aparecer dentro del
      # contenido, y 'iejson' no lo es.
      - name: Generar el snapshot
        run: |
          set -uo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN no esta configurado. Nada se pudo respaldar."
            exit 1
          fi

          mkdir -p supabase/backups
          fecha=$(date -u +%Y-%m-%d)
          destino="supabase/backups/${fecha}.sql"

          {
            echo "-- Respaldo del contenido del colegio Jose Celestino Mutis"
            echo "-- Generado: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "-- Restaurar pegando el bloque de la tabla afectada en el SQL Editor de Supabase."
            echo "-- NO incluye los archivos de Storage ni las cuentas de administracion."
            echo
          } > "$destino"

          total_filas=0

          for tabla in announcements events gallery documents school_info; do
            # Ojo: dentro de un bloque `run: |` de YAML todas las lineas van
            # indentadas, asi que el SQL se arma en una sola linea.
            SQL="select coalesce(jsonb_agg(to_jsonb(t))::text, '[]') as js from public.${tabla} t"
            jq -n --arg q "$SQL" '{query: $q}' > "${RUNNER_TEMP}/q.json"

            respuesta=$(curl -s --max-time 60 -X POST \
              "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "@${RUNNER_TEMP}/q.json" 2>/dev/null) || respuesta=""

            js=$(echo "$respuesta" | jq -r '.[0].js // empty' 2>/dev/null)

            if [ -z "$js" ]; then
              echo "::error::No se pudo leer la tabla ${tabla}. Respuesta: ${respuesta}"
              exit 1
            fi

            filas=$(echo "$js" | jq -r 'if type == "array" then length else -1 end' 2>/dev/null)

            # El delimitador tiene que aparecer un numero par de veces: si el
            # contenido trajera el cierre adentro, el bloque quedaria truncado
            # y la restauracion fallaria justo cuando mas falta.
            cierres=$(echo "$js" | grep -o -F '$iejson$' | wc -l)
            if [ "$filas" = "-1" ] || [ -z "$filas" ]; then
              echo "::error::El JSON de ${tabla} no es un array valido"
              exit 1
            fi
            if [ "$cierres" -ne 0 ]; then
              echo "::error::El contenido de ${tabla} contiene el delimitador \$iejson\$; se eligio mal el delimitador"
              exit 1
            fi

            total_filas=$((total_filas + filas))

            {
              echo "-- ${tabla}: ${filas} fila(s)"
              echo "insert into public.${tabla}"
              echo "select * from jsonb_populate_recordset(null::public.${tabla}, \$iejson\$${js}\$iejson\$::jsonb);"
              echo
            } >> "$destino"

            echo "${tabla}: ${filas} fila(s)"
          done

          echo "${total_filas} filas en total -> ${destino}"
          echo "TOTAL=${total_filas}" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # 2. Comprobar que el archivo quedo bien formado
      #
      # Un respaldo que nunca se ha verificado no es un respaldo. Si el JSON
      # esta truncado o mal formado, el dia que se necesite va a fallar
      # justo cuando mas apuros estan.
      - name: Verificar que el snapshot esta completo
        run: |
          set -uo pipefail
          fecha=$(date -u +%Y-%m-%d)
          destino="supabase/backups/${fecha}.sql"

          if [ ! -s "$destino" ]; then
            echo "::error::El archivo ${destino} salio vacio."
            exit 1
          fi

          # Un bloque de insercion por tabla, cada uno con su cierre.
          aperturas=$(grep -c '^insert into public\.' "$destino" || true)
          cierres=$(grep -c '::jsonb);$' "$destino" || true)

          echo "Bloques de insercion: ${aperturas}"
          echo "Bloques cerrados:    ${cierres}"

          if [ "$aperturas" -ne 5 ] || [ "$cierres" -ne 5 ]; then
            echo "::error::Se esperaban 5 bloques completos y llegaron ${aperturas}/${cierres}."
            exit 1
          fi

          echo "Las 5 tablas quedaron respaldadas."

      # ------------------------------------------------------------------
      # 3. Guardar
      #
      # Politica de retencion: 14 dias de respaldos diarios, mas los de cada
      # lunes que se conservan 90 dias. Asi hay siempre una copia de
      # principio de semana aunque el respaldo diario se haya fallado.
      - name: Limpiar respaldos viejos
        run: |
          set -uo pipefail
          dia_semana=$(date -u +%u)
          if [ "$dia_semana" = "1" ]; then
            echo "Es lunes: se conservan los respaldos semanales."
            find supabase/backups -name '*.sql' -mtime +90 -print -delete
          else
            echo "Se conservan los ultimos 14 respaldos diarios."
            find supabase/backups -name '*.sql' -mtime +14 -print -delete
          fi

      - name: Confirmar el respaldo
        run: |
          set -uo pipefail
          fecha=$(date -u +%Y-%m-%d)
          destino="supabase/backups/${fecha}.sql"
          tamano=$(wc -c < "$destino")
          echo "Respaldo del ${fecha}: ${tamano} bytes, ${TOTAL} filas."
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destino" supabase/backups
          if git diff --cached --quiet; then
            echo "Sin cambios respecto al respaldo anterior."
            exit 0
          fi
          git commit -m "chore(backup): respaldo del ${fecha} (${TOTAL} filas)"
          git push

      - name: Resumen
        run: echo "Respaldo guardado en supabase/backups/${fecha:-$(date -u +%Y-%m-%d)}.sql"